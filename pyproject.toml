[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "susight-backend"
version = "0.1.0"
description = "Dataset preparation, robust queue scoring and advisory AI tribunal"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.9,<3",
    "scipy>=1.14,<2",
    "google-genai>=1,<3",
    "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "pandas>=2.2,<4", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.hatch.build.targets.wheel]
packages = ["src/susight"]
